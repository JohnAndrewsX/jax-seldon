[package]
name = "seldon"
version = "0.1.4"
edition = "2024"
rust-version = "1.89"
description = "Flight recorder and planning desk for an Omarchy system (engine)"
license = "MIT"
repository = "https://github.com/JohnAndrewsX/jax-seldon"
publish = false

[[bin]]
name = "seldon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
# `seldon completions` and `seldon mangen` (WP-049, approved by the
# operator 2026-10-02): generated from the clap definition, so they never
# drift from --help; clap_mangen brings `roff`.
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dialoguer = { version = "0.12.0", default-features = false }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
toml = "1.1.6"
ulid = { version = "3", features = ["serde"] }
# `seldon watch` only (WP-034): the one watcher crate AGENTS.md §7 allows;
# its inotify backend runs on its own thread, no async runtime.
notify = { version = "8.2.0", default-features = false, optional = true }

[features]
default = []
# `seldon watch`: rebuild index.json when the logbook changes (ADR-0005:
# optional, off by default). The published release binary and the Arch
# package are built with it (release workflow, PKGBUILD); a plain
# `cargo build` and `just build-release` leave it out.
watch = ["dep:notify"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `cargo bench` / `just bench` (CI): inherits release, but compiles in a
# fraction of the time; the index timing keeps ~20× headroom (WP-007).
[profile.bench]
lto = "thin"
codegen-units = 16

[dev-dependencies]
jsonschema = { version = "0.58.3", default-features = false }

[[bench]]
name = "index"
harness = false
