[package]
name = "seldon"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Flight recorder and planning desk for an Omarchy system (engine)"
license = "MIT"
repository = "https://github.com/JohnAndrewsX/jax-seldon"
publish = false

[[bin]]
name = "seldon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
toml = "1.1.6"
ulid = { version = "3", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
jsonschema = { version = "0.58.3", default-features = false }
