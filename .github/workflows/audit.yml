# RustSec advisories for engine/Cargo.lock (WP-048): weekly, by hand, and
# on every push or pull request that changes the lock file or the list of
# accepted advisories (packaging/audit-ignore.txt).
#
# Advisory: a finding (an advisory, an unmaintained or a yanked crate, or
# an expired entry in the accepted list) leaves the job green with a
# warning annotation on the run. The release build runs the same check as
# a gate (release.yml, CONTRIBUTING.md "Dependency advisories"), so the
# warning here is the early notice.
name: audit

on:
  schedule:
    - cron: '17 5 * * 1'  # Mondays 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main, next]
    paths:
      - engine/Cargo.lock
      - packaging/audit-ignore.txt
      - packaging/audit-ignore.sh
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - engine/Cargo.lock
      - packaging/audit-ignore.txt
      - packaging/audit-ignore.sh
      - .github/workflows/audit.yml

permissions:
  contents: read

jobs:
  # The build image from GHCR, not Docker Hub (WP-195): on a push to
  # main or next, copies the pinned digest from Docker Hub when GHCR does
  # not have it yet. The only job with packages: write, and it never runs
  # on a pull request; the jobs below pull by digest, after this job when
  # it runs (packaging/mirror-image.sh; packaging/README.md, "Pinned
  # actions and image").
  mirror:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Mirror the build image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash packaging/mirror-image.sh

  audit:
    needs: mirror
    # also when mirror was skipped (no push); never after it failed
    if: ${{ !cancelled() && (needs.mirror.result == 'success' || needs.mirror.result == 'skipped') }}
    runs-on: ubuntu-latest
    # pinned like ci.yml (packaging/README.md, "Pinned actions and image"),
    # pulled from the GHCR copy
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/johnandrewsx/jax-seldon/archlinux@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3 # base-devel-20260927.0.600689
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      # Arch's `cargo-audit` pulls in cargo; the advisory database is
      # fetched from github.com/rustsec/advisory-db at run time.
      - name: Install cargo-audit
        run: pacman -Syu --noconfirm --needed git cargo-audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: cargo audit
        id: audit
        continue-on-error: true
        shell: bash  # -eo pipefail; the ignore list fails the step when invalid
        run: |
          ids=$(bash packaging/audit-ignore.sh)
          args=()
          for id in $ids; do args+=(--ignore "$id"); done
          echo "accepted advisories: ${ids:-none}"
          cargo audit --file engine/Cargo.lock --deny warnings "${args[@]}"

      - name: Report findings
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning title=cargo audit::cargo audit failed for engine/Cargo.lock (RustSec findings, an expired entry in packaging/audit-ignore.txt, or the advisory database could not be fetched); the next release build fails the same way. See the cargo audit step log (CONTRIBUTING.md, Dependency advisories)"
          {
            echo '## cargo audit: findings'
            echo 'See the log of the cargo audit step. Update the crate, or accept the advisory in packaging/audit-ignore.txt with a reason and an expiry. Until then the release build fails.'
          } >> "$GITHUB_STEP_SUMMARY"
