# CI runs `just check` in an Arch Linux container (docs/TESTING.md, "What
# CI runs").
#
# What runs here for the plugin (WP-190):
#   - Omarchy's plugin validator on plugin/: the validator of
#     packaging/omarchy-pin, fetched over HTTPS and refused unless its
#     sha256 matches (packaging/omarchy-validate.sh)
#   - node tests/plugin/model.test.js, model.bench.js (budgets x3),
#     terminal-scripts.sh, real-home-guard.test.sh
# The check job's SELDON_SKIP_HOST_CHECKS=1 skips qmllint and the
# Quickshell harnesses; the plugin-qml job runs them (WP-191, ADR-0055):
#   - just qmllint (with check-tokens.py), just plugin-test with the four
#     harnesses, and Omarchy's QML text-format scan on plugin/, against
#     Omarchy's shell tree at packaging/omarchy-pin (packaging/omarchy-tree.sh),
#     the tree Omarchy stable ships, with the Quickshell and Qt of
#     Omarchy's stable package mirror (E93: a release must work on
#     stable). The scan runs only here; the dev host's stricter check is
#     plaintext.test.js. The hosts run the same recipes against their
#     installed trees: the test host's rc is the rehearsal, the dev host's
#     edge a preview (ADR-0055 §4).
name: ci

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

jobs:
  # The build image from GHCR, not Docker Hub (WP-195): on a push to
  # main or next, copies the pinned digest from Docker Hub when GHCR does
  # not have it yet. The only job with packages: write, and it never runs
  # on a pull request; the jobs below pull by digest, after this job when
  # it runs (packaging/mirror-image.sh; packaging/README.md, "Pinned
  # actions and image").
  mirror:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Mirror the build image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash packaging/mirror-image.sh

  check:
    needs: mirror
    # also when mirror was skipped (no push); never after it failed
    if: ${{ !cancelled() && (needs.mirror.result == 'success' || needs.mirror.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Actions and the image are pinned (commit SHA, image digest) with the
    # version as a comment; packaging/README.md says how to refresh them.
    # The image is Docker Hub's archlinux:base-devel, pulled from its GHCR
    # copy (same digest); the token reads it.
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/johnandrewsx/jax-seldon/archlinux@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3 # base-devel-20260927.0.600689
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SELDON_SKIP_HOST_CHECKS: "1"
      CARGO_TERM_COLOR: always
    steps:
      # Arch's `rust` package ships cargo, clippy and rustfmt; `nodejs` runs
      # the plugin's node tests.
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed git rust just jq shellcheck rsync nodejs qt6-base qt6-declarative qt6-svg qt6-wayland

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: just check
        run: just check

      - name: just bench (index build < 100 ms on x10 fixtures, release)
        run: just bench

      # Measured, not gated (WP-195): the peak RSS of `seldon watch` on the
      # x10 fixture, five runs on this runner, into the run summary; a run
      # over check-rss's limit is a warning here, not a failure, until the
      # limit is confirmed on CI too (docs/TESTING.md, "Memory bound").
      - name: just check-rss (measured, not gated)
        shell: bash
        run: |
          failed=0
          for run in 1 2 3 4 5; do
            if ! just check-rss 2>&1 | tee -a rss.log; then failed=$((failed + 1)); fi
          done
          lines=$(grep -E 'watch on|≥' rss.log || true)
          {
            echo '## check-rss: peak RSS of seldon watch on the x10 fixture'
            echo '```'
            echo "${lines:-(no measurement line: check-rss did not build or run its test)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # no measurement is a broken test, not a number: fail, and say so
          if [[ -z $lines ]]; then
            echo "::error title=check-rss::no measurement line in 5 runs: check-rss did not build or run its test (see this step's log)"
            exit 1
          fi
          if ((failed > 0)); then
            echo "::warning title=check-rss::$failed of 5 runs failed or were over the limit (see the run summary; docs/TESTING.md, Memory bound)"
          fi

  # Stage 2 of the plugin's checks (WP-191, ADR-0055): the QML checks the
  # dev host runs, against the pinned shell tree. A job of its own, so
  # `check` stays as fast as it is; never SELDON_SKIP_HOST_CHECKS here.
  plugin-qml:
    needs: mirror
    # also when mirror was skipped (no push); never after it failed
    if: ${{ !cancelled() && (needs.mirror.result == 'success' || needs.mirror.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/johnandrewsx/jax-seldon/archlinux@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3 # base-devel-20260927.0.600689
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Omarchy's stable package mirror (E93, ADR-0055 §3): the Quickshell
      # and Qt Omarchy stable ships, not Arch's newest. -Syuu moves the
      # whole container to that snapshot, downgrades included. "Mirror
      # against the pin" fails when this line is not the pin's.
      - name: Install from Omarchy's stable mirror
        run: |
          echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syuu --noconfirm --needed git just jq python nodejs quickshell qt6-declarative ttf-jetbrains-mono-nerd

      # Omarchy's scan and the plugin run as root here: no token in .git/config
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The pinned Omarchy tree
        id: tree
        run: bash packaging/omarchy-tree.sh "$RUNNER_TEMP/omarchy"

      - name: Mirror against the pin
        run: cmp "$RUNNER_TEMP/omarchy/default/pacman/mirrorlist-stable" /etc/pacman.d/mirrorlist

      - name: Versions
        shell: bash
        run: |
          {
            echo '## plugin-qml: Quickshell, Qt and the Omarchy tree'
            echo '```'
            quickshell --version
            pacman -Q quickshell qt6-base qt6-declarative ttf-jetbrains-mono-nerd
            /usr/lib/qt6/bin/qmllint --version
            cat /etc/pacman.d/mirrorlist
            echo "omacom/omarchy $(git -C "$RUNNER_TEMP/omarchy" rev-parse HEAD)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Each recipe with its own HOME and its own 0700 XDG_RUNTIME_DIR and
      # JUST_TEMPDIR, removed afterwards (AGENTS.md §6); each Quickshell a
      # harness starts gets its own on top (WP-161). The QML checks run
      # even when one before them failed, so a red run shows all three.
      - name: just qmllint (the pinned shell)
        if: ${{ !cancelled() && steps.tree.outcome == 'success' }}
        shell: bash
        run: |
          export OMARCHY_PATH=$RUNNER_TEMP/omarchy
          home=$(mktemp -d -p "$RUNNER_TEMP" home.XXXXXX)
          rt=$(mktemp -d -p "$RUNNER_TEMP" rt.XXXXXX)
          chmod 700 "$home" "$rt"
          trap 'rm -rf "$home" "$rt"' EXIT
          HOME="$home" XDG_RUNTIME_DIR="$rt" JUST_TEMPDIR="$rt" just qmllint

      # The harnesses always run here (SELDON_FULL_CHECK=1: no merge-base
      # skip), and a log that says they were skipped fails the step. The
      # node bench's budgets are tripled, as in the check job.
      - name: just plugin-test (the four Quickshell harnesses, the pinned shell)
        if: ${{ !cancelled() && steps.tree.outcome == 'success' }}
        shell: bash
        run: |
          export OMARCHY_PATH=$RUNNER_TEMP/omarchy
          home=$(mktemp -d -p "$RUNNER_TEMP" home.XXXXXX)
          rt=$(mktemp -d -p "$RUNNER_TEMP" rt.XXXXXX)
          chmod 700 "$home" "$rt"
          trap 'rm -rf "$home" "$rt"' EXIT
          HOME="$home" XDG_RUNTIME_DIR="$rt" JUST_TEMPDIR="$rt" SELDON_FULL_CHECK=1 SELDON_BENCH_BUDGET_SCALE=3 \
            just plugin-test 2>&1 | tee "$RUNNER_TEMP/plugin-test.log"
          if grep -q 'Quickshell harnesses skipped' "$RUNNER_TEMP/plugin-test.log"; then
            echo "::error title=plugin-test::the Quickshell harnesses were skipped; this job must run them (ADR-0055)"
            exit 1
          fi

      # Omarchy's own scan (test/shell.d at the pin) reads ROOT/shell and
      # prints one line per Text with a non-literal binding and no
      # textFormat, exit 0; any line fails the step. Only CI runs it: the
      # Omarchy package installs no test/ (ADR-0055 §2).
      - name: Omarchy's QML text-format scan on plugin/
        if: ${{ !cancelled() && steps.tree.outcome == 'success' }}
        shell: bash
        run: |
          scan_root=$(mktemp -d -p "$RUNNER_TEMP" scan.XXXXXX)
          trap 'rm -rf "$scan_root"' EXIT
          cp -r plugin "$scan_root/shell"
          found=$(python3 -I "$RUNNER_TEMP/omarchy/test/shell.d/qml-text-format-scan.py" "$scan_root" | sed 's|^shell/|plugin/|')
          if [[ -n $found ]]; then
            echo "$found"
            echo "::error title=text-format scan::$(wc -l <<< "$found") Text element(s) in plugin/ without textFormat (Omarchy's scan at the pin)"
            exit 1
          fi
          echo "text-format scan: ok ($(find plugin -name '*.qml' | wc -l) QML files)"
