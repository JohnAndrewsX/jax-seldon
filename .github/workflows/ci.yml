# CI runs `just check` in an Arch Linux container.
#
# What does NOT run here (see docs/TESTING.md):
#   - `omarchy plugin validate plugin/`  needs the omarchy CLI (an Omarchy install)
#   - qmllint against the shell          needs $OMARCHY_PATH/shell and Quickshell's QML modules
# Both are skipped via SELDON_SKIP_HOST_CHECKS=1 and run on the dev host
# with `just check` before every handover.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Actions and the image are pinned (commit SHA, image digest) with the
    # version as a comment; packaging/README.md says how to refresh them.
    container: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3 # base-devel-20260927.0.600689
    env:
      SELDON_SKIP_HOST_CHECKS: "1"
      CARGO_TERM_COLOR: always
    steps:
      # Arch's `rust` package ships cargo, clippy and rustfmt.
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed git rust just jq shellcheck

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: just check
        run: just check

      - name: just bench (index build < 100 ms on x10 fixtures, release)
        run: just bench
