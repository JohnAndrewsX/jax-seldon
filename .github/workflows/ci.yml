# CI runs `just check` in an Arch Linux container (docs/TESTING.md, "What
# CI runs").
#
# What runs here for the plugin (WP-190):
#   - Omarchy's plugin validator on plugin/: the validator of
#     packaging/omarchy-pin, fetched over HTTPS and refused unless its
#     sha256 matches (packaging/omarchy-validate.sh)
#   - node tests/plugin/model.test.js, model.bench.js (budgets x3),
#     terminal-scripts.sh, real-home-guard.test.sh
# What does NOT run here; SELDON_SKIP_HOST_CHECKS=1 skips it with a notice,
# the dev host runs it with `just check` before every handover:
#   - qmllint against the shell          needs $OMARCHY_PATH/shell and Quickshell's QML modules
#   - the Quickshell harnesses           need quickshell and the installed shell (WP-191)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The build image from GHCR, not Docker Hub (WP-195): copies the
  # pinned digest from Docker Hub once, when GHCR does not have it yet;
  # the other jobs pull it from there. The only job with packages: write
  # (packaging/mirror-image.sh; packaging/README.md, "Pinned actions
  # and image").
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Mirror the build image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash packaging/mirror-image.sh

  check:
    needs: image
    runs-on: ubuntu-latest
    # Actions and the image are pinned (commit SHA, image digest) with the
    # version as a comment; packaging/README.md says how to refresh them.
    # The image is Docker Hub's archlinux:base-devel, pulled from its GHCR
    # copy (same digest); the token reads it.
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/johnandrewsx/jax-seldon/archlinux@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3 # base-devel-20260927.0.600689
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SELDON_SKIP_HOST_CHECKS: "1"
      CARGO_TERM_COLOR: always
    steps:
      # Arch's `rust` package ships cargo, clippy and rustfmt; `nodejs` runs
      # the plugin's node tests.
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed git rust just jq shellcheck rsync nodejs

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: just check
        run: just check

      - name: just bench (index build < 100 ms on x10 fixtures, release)
        run: just bench

      # Measured, not gated (WP-195): the peak RSS of `seldon watch` on the
      # x10 fixture, five runs on this runner, into the run summary; a run
      # over check-rss's limit is a warning here, not a failure, until the
      # limit is confirmed on CI too (docs/TESTING.md, "Memory bound").
      - name: just check-rss (measured, not gated)
        shell: bash
        run: |
          over=0
          for run in 1 2 3 4 5; do
            if ! just check-rss 2>&1 | tee -a rss.log; then over=$((over + 1)); fi
          done
          {
            echo '## check-rss: peak RSS of seldon watch on the x10 fixture'
            echo '```'
            grep -E 'watch on|≥' rss.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ((over > 0)); then
            echo "::warning title=check-rss::$over of 5 runs over the limit (see the run summary; docs/TESTING.md, Memory bound)"
          fi
